<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{background:#0d0d0d;color:#fff}
        .header{background:#1a1a1a;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff5500}
        .logo{font-size:24px;font-weight:bold;color:#ff5500}.logo span{color:#fff}
        .nav a{color:#fff;text-decoration:none;margin-left:30px;transition:.3s}.nav a:hover{color:#ff5500}
        .container{max-width:600px;margin:40px auto;padding:0 20px}
        .title{font-size:28px;color:#ff5500;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;color:#aaa;margin-bottom:5px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;font-size:16px}
        .form-group textarea{height:80px;resize:vertical}
        .btn{width:100%;background:#ff5500;color:#fff;padding:14px;border-radius:30px;border:none;font-weight:600;font-size:16px;cursor:pointer;transition:.3s}
        .btn:hover{background:#ff7700}
        .back-link{color:#666;text-decoration:none;display:inline-block;margin-bottom:20px}.back-link:hover{color:#ff5500}
        .flash{max-width:600px;margin:20px auto;padding:0 20px}
        .flash-msg{padding:12px 20px;border-radius:8px;margin-bottom:10px}
        .flash-success{background:#1a3a1a;border:1px solid #57F287;color:#57F287}
        .flash-error{background:#3a1a1a;border:1px solid #ED4245;color:#ED4245}
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">AFG <span>Admin</span></div>
        <nav class="nav">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/add_product">➕ Add Product</a>
            <a href="/admin/logout">🚪 Logout</a>
        </nav>
    </header>

    <div class="flash">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-msg flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>

    <div class="container">
        <a href="/admin/dashboard" class="back-link">← Back</a>
        <h1 class="title">➕ Add New Product</h1>
        <form method="POST">
            <div class="form-group"><label>Product ID</label><input type="text" name="id" placeholder="hoodie_blue" required></div>
            <div class="form-group"><label>Product Name</label><input type="text" name="name" placeholder="Blue Hoodie" required></div>
            <div class="form-group"><label>Price</label><input type="number" name="price" step="0.01" placeholder="29.99" required></div>
            <div class="form-group"><label>Category</label><select name="category" required><option value="MEN">MEN</option><option value="WOMEN">WOMEN</option><option value="GIRLS">GIRLS</option><option value="BOYS">BOYS</option></select></div>
            <div class="form-group"><label>Sizes (comma separated)</label><input type="text" name="sizes" placeholder="S, M, L, XL" required></div>
            <div class="form-group"><label>Colors (comma separated)</label><input type="text" name="colors" placeholder="Black, White" required></div>
            <div class="form-group"><label>Image URLs (comma separated)</label><input type="text" name="image_urls" placeholder="https://example.com/image.jpg"></div>
            <div class="form-group"><label>Stock</label><input type="number" name="stock" placeholder="50" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" placeholder="Product description..."></textarea></div>
            <div class="form-group"><label>Badge</label><select name="badge"><option value="NEW">NEW</option><option value="BEST SELLER">BEST SELLER</option><option value="SALE">SALE</option><option value="TRENDING">TRENDING</option><option value="">None</option></select></div>
            <button type="submit" class="btn">✅ Add Product</button>
        </form>
    </div>
</body>
</html>
