<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{background:#0d0d0d;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
        .login-box{background:#1a1a1a;padding:50px;border-radius:20px;border:1px solid #ff5500;max-width:400px;width:90%}
        h1{text-align:center;color:#ff5500;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;color:#aaa;margin-bottom:5px}
        .form-group input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#111;color:#fff;font-size:16px}
        .btn{width:100%;background:#ff5500;color:#fff;padding:14px;border-radius:30px;border:none;font-weight:600;font-size:16px;cursor:pointer;transition:.3s}
        .btn:hover{background:#ff7700}
        .flash{margin-bottom:20px}
        .flash-msg{padding:12px 20px;border-radius:8px;margin-bottom:10px}
        .flash-success{background:#1a3a1a;border:1px solid #57F287;color:#57F287}
        .flash-error{background:#3a1a1a;border:1px solid #ED4245;color:#ED4245}
        .back-link{display:block;text-align:center;margin-top:15px;color:#666;text-decoration:none}
        .back-link:hover{color:#ff5500}
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Admin Login</h1>
        <div class="flash">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-msg flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
        </div>
        <form method="POST">
            <div class="form-group"><label>Admin Password</label><input type="password" name="password" required></div>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="/" class="back-link">← Back to Store</a>
    </div>
</body>
</html>
